<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>VANTA</title>
  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VANTA">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <!-- Opening scene: the cover is styled inline so nothing of the app shows
       before the stylesheets arrive; intro-gate.js hides it before first paint
       when the scene is not due. The animation removes the cover on its own;
       the keyframe below is the no-JS safety net. The gate stays a classic
       script outside the Vite build (vite-ignore) and is served as is. -->
  <style>
    #intro { position: fixed; inset: 0; z-index: 2147483000; background: #000; animation: intro-failsafe 0s 15s forwards; }
    #intro canvas { display: block; width: 100%; height: 100%; }
    html.intro-off #intro { display: none; }
    @keyframes intro-failsafe { to { visibility: hidden; pointer-events: none; } }
  </style>
  <script src="/js/intro-gate.js" vite-ignore></script>
  <!-- Outfit, self-hosted (see css/fonts.css); the latin file covers every
       declared weight, so one preload warms the whole family -->
  <link rel="preload" href="/assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components/navbar/navbar.css">
  <link rel="stylesheet" href="/css/components/navbar/mobile-drawer.css">
  <link rel="stylesheet" href="/css/components/footer.css">
  <link rel="stylesheet" href="/css/components/settings/settings-dialog.css">
  <link rel="stylesheet" href="/css/components/settings/settings-overview.css">
  <link rel="stylesheet" href="/css/components/settings/settings-password.css">
  <link rel="stylesheet" href="/css/components/media-card.css">
  <link rel="stylesheet" href="/css/components/carousel.css">
  <link rel="stylesheet" href="/css/components/loader.css">
  <link rel="stylesheet" href="/css/components/skeleton.css">
  <link rel="stylesheet" href="/css/components/toast.css">
  <link rel="stylesheet" href="/css/components/buttons.css">
  <link rel="stylesheet" href="/css/components/played-toggle.css">
  <link rel="stylesheet" href="/css/components/confirm-dialog.css">
  <link rel="stylesheet" href="/css/components/page-heading.css">
  <link rel="stylesheet" href="/css/components/admin-tools/admin-tools.css">
  <link rel="stylesheet" href="/css/components/admin-tools/requests-tool.css">
  <link rel="stylesheet" href="/css/components/admin-tools/users-tool.css">
  <link rel="stylesheet" href="/css/components/watch-party/watch-party-dialog.css">
  <link rel="stylesheet" href="/css/components/watch-party/watch-party-invitation-overlay.css">
  <link rel="stylesheet" href="/css/components/offline-overlay.css">
  <link rel="stylesheet" href="/css/pages/login.css">
  <link rel="stylesheet" href="/css/pages/home.css">
  <link rel="stylesheet" href="/css/pages/publishers.css">
  <link rel="stylesheet" href="/css/pages/library.css">
  <link rel="stylesheet" href="/css/pages/profile.css">
  <link rel="stylesheet" href="/css/pages/search.css">
  <link rel="stylesheet" href="/css/pages/detail.css">
  <link rel="stylesheet" href="/css/pages/actor-modal.css">
  <link rel="stylesheet" href="/css/pages/requests.css">
  <link rel="stylesheet" href="/css/pages/admin/layout.css">
  <link rel="stylesheet" href="/css/pages/admin/header.css">
  <link rel="stylesheet" href="/css/pages/admin/sections.css">
  <link rel="stylesheet" href="/css/pages/admin/settings-panel.css">
  <link rel="stylesheet" href="/css/pages/admin/responsive.css">
  <link rel="stylesheet" href="/css/pages/trailer-scroller.css">
  <link rel="stylesheet" href="/css/pages/watch-party.css">
  <link rel="stylesheet" href="/css/player.css">
  <!-- The player's stylesheet comes from its own build, like its JS, which
       the app imports at runtime; bundling it here would freeze it at the
       last app build while the player JS moves on (vite-ignore). -->
  <link rel="stylesheet" href="/vendor/player/vanta-player.css" vite-ignore>
</head>
<body>
  <!-- Opening scene cover, see intro-gate.js -->
  <div id="intro" aria-hidden="true"><canvas></canvas></div>

  <!-- Root Container for dynamic page loading -->
  <div id="app"></div>

  <!-- Shared Notification System -->
  <div id="toast-container"></div>

  <!-- Application Entry -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
