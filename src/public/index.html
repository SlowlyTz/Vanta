<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>VANTA</title>
  <!-- Opening scene: the cover is styled inline so nothing of the app shows
       before the stylesheets arrive; intro-gate.js hides it before first paint
       when the scene is not due. The animation removes the cover on its own;
       the keyframe below is the no-JS safety net. -->
  <style>
    #intro { position: fixed; inset: 0; z-index: 2147483000; background: #000; animation: intro-failsafe 0s 15s forwards; }
    #intro canvas { display: block; width: 100%; height: 100%; }
    html.intro-off #intro { display: none; }
    @keyframes intro-failsafe { to { visibility: hidden; pointer-events: none; } }
  </style>
  <script src="/js/intro-gate.js"></script>
  <!-- Google Fonts: Outfit for premium look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components/navbar/navbar.css">

  <link rel="stylesheet" href="/css/components/admin-tools/requests-tool.css">
  <link rel="stylesheet" href="/css/components/admin-tools/users-tool.css">
  <link rel="stylesheet" href="/css/components/watch-party/watch-party-dialog.css">
  <link rel="stylesheet" href="/css/components/watch-party/watch-party-invitation-overlay.css">
  <link rel="stylesheet" href="/css/pages/login.css">
