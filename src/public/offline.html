<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>Kein Internet – VANTA</title>
  <!-- Served by sw.js when a page load fails without a connection. The styles
       are inline because only this file, js/offline.js, the logo and the latin
       font are cached; they mirror css/components/offline-overlay.css. -->
  <style>
    @font-face {
      font-family: 'Outfit';
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
      src: url(/assets/fonts/outfit-latin.woff2) format('woff2');
    }
    :root {
      --bg-primary: hsl(240, 10%, 4%);
      --bg-glass: rgba(42, 42, 42, 0.69);
      --text-primary: hsl(0, 0%, 96%);
      --text-secondary: hsl(240, 5%, 65%);
      --text-muted: hsl(240, 5%, 45%);
      --accent: 245, 245, 247;
      --error-color: hsl(0, 85%, 60%);
      --error-bg: hsla(0, 85%, 60%, 0.1);
      --radius-md: 12px;
      --radius-lg: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(circle at 50% 30%, hsl(240, 10%, 12%) 0%, transparent 60%),
        var(--bg-primary);
      -webkit-font-smoothing: antialiased;
    }
    .offline-overlay {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .offline-card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1rem;
      padding: clamp(28px, 6vw, 40px);
      background: var(--bg-glass);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
      animation: offline-card-in 320ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .offline-logo { width: 96px; height: auto; filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.42)); }
    .offline-icon {
      width: 56px; height: 56px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--error-bg);
      color: var(--error-color);
      margin-top: 0.25rem;
    }
    .offline-title { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; }
    .offline-text { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; max-width: 34ch; }
    .offline-retry {
      margin-top: 0.5rem;
      min-width: 200px; min-height: 48px;
      padding: 12px 28px;
      border: 0; border-radius: var(--radius-md);
      background: rgb(var(--accent));
      color: var(--bg-primary);
      font: inherit; font-weight: 600; font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s;
    }
    .offline-retry:hover { background: #fff; transform: scale(1.03); box-shadow: 0 0 20px rgba(var(--accent), 0.2); }
    .offline-retry[disabled] { opacity: 0.7; cursor: progress; transform: none; box-shadow: none; }
    .offline-status { min-height: 1.2em; font-size: 0.85rem; color: var(--text-muted); }
    @keyframes offline-card-in {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .offline-card { animation: none; }
      .offline-retry { transition: none; }
    }
  </style>
</head>
<body>
  <main class="offline-overlay">
    <div class="offline-card" role="alertdialog" aria-labelledby="offline-title" aria-describedby="offline-text">
      <img class="offline-logo" src="/assets/logo-vanta.png" alt="VANTA">
      <span class="offline-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"></path><path d="M8.5 16.5a5 5 0 0 1 7 0"></path><path d="M5 12.5a10 10 0 0 1 5.2-2.7"></path><path d="M14.5 9.5A10 10 0 0 1 19 12.5"></path><path d="M1.5 8.5A15 15 0 0 1 7 5.6"></path><path d="M11.5 4.5a15 15 0 0 1 11 4"></path><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"></circle></svg>
      </span>
      <h1 class="offline-title" id="offline-title">Kein Internet</h1>
      <p class="offline-text" id="offline-text">VANTA braucht eine Verbindung zu deinem Server. Prüfe WLAN oder Mobilfunk und versuch es dann noch einmal.</p>
      <button class="offline-retry" id="offline-retry" type="button">Erneut versuchen</button>
      <p class="offline-status" id="offline-status" aria-live="polite"></p>
    </div>
  </main>
  <script src="/js/offline.js"></script>
</body>
</html>
